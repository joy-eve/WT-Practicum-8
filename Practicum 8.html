
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SupplySphere - Responsive Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #eef2f3;
            color: #183b4e;
        }

        h1 {
            text-align: center;
        }

        .description {
            text-align: center;
            margin-bottom: 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        @media screen and (max-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media screen and (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            body {
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>SupplySphere Image Gallery</h1>
    <p class="description">
        Explore our warehouses, shipments and delivery operations.
    </p>

    <div class="gallery">
        <img src="warehouse.jpg" alt="Supply warehouse">
        <img src="ll.jpg" alt="Goods transportation">
        <img src="cc.jpg" alt="Shipping operations">
        <img src="truck.jpg" alt="Delivery vehicle">
        <img src="container.jpg" alt="Warehouse storage">
        <img src="logic.jpg" alt="Logistics operations">
    </div>

</body>
</html>
